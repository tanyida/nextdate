<html lang="en-SG">
<head>

  <meta name="description" content="Turn your preferences into a ready-to-go Singapore date plan: an activity, a meal nearby and an invitation to send, in under two minutes.">
  <meta name="theme-color" content="#c7354a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="styles.css?v=16">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <a href="#/" class="logo" aria-label="Next Date home"><span aria-hidden="true">💞</span> Next <em>Date</em></a>
    <nav class="mainnav" aria-label="Main">
      <a href="#/" data-nav="plan">Plan a date</a>
      <a href="#/events" data-nav="events">Latest events</a>
      <a href="#/gifts" data-nav="gifts">Gift ideas</a>
      <a href="#/memories" data-nav="memories">Memories</a>
      <a href="#/plans" data-nav="plans">My plans</a>
    </nav>
  </header>
  <main id="app" tabindex="-1">
    <p class="boot-msg" id="boot-msg">Loading Next Date…</p>
    <noscript><p class="boot-msg">Next Date needs JavaScript turned on.</p></noscript>
  </main>
  <footer class="foot">
    <p>Next Date is an independent website. It is not affiliated with, endorsed by or connected to the Singapore Government or the government's First Date app.</p>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/photos-official.js?v=16"></script>
  <script src="js/store.js?v=16"></script>
  <script src="js/engine.js?v=16"></script>
  <script src="js/invite.js?v=16"></script>
  <script src="js/events-eventbrite.js?v=16"></script>
  <script src="js/activities-gyg.js?v=16"></script>
  <script src="js/activities-curated.js?v=16"></script>

  <script src="js/gifts-data.js?v=16"></script>
  <script src="js/gifts.js?v=16"></script>
  <script src="js/memories.js?v=16"></script>
  <script src="js/app.js?v=16"></script>
  <script>
    // If the app scripts didn't load (e.g. the js/ folder is missing on the server), say so instead of a blank page.
    (function () {
      function check() {
        if (window.PL && PL.app) return;
        var el = document.getElementById('app');
        el.innerHTML = '<div class="boot-msg"><h1>Sorry, the app didn’t load</h1>' +
          '<p>The page couldn’t load its script files from the <code>js/</code> folder. ' +
          'If you just deployed, check that the <code>js</code> folder (15 files) is in your repository next to <code>index.html</code>.</p>' +
          '<p><a href="js/app.js">Test: open js/app.js</a></p></div>';
      }
      if (document.readyState === 'complete') check(); else window.addEventListener('load', check);
    })();
  </script>
</body>
</html>
